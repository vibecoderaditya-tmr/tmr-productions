<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin — Team Slots</title>
  <link rel="stylesheet" href="css/admin/admin.css">
</head>
<body>
  <nav class="admin-nav" id="admin-nav">
    <button class="nav-btn active" data-tab="live" onclick="switchTab('live')">LIVE</button>
  </nav>

  <div class="admin-panel" id="live-panel">
    <div class="panel-header">
      <div class="slot-header">SLOT</div>
      <div class="team-header">TEAMS</div>
    </div>
    <div class="panel-body" id="live-body"></div>
  </div>

  <div class="admin-panel match-panel hidden" id="match-panel"></div>

  <div class="copy-bar">
    <button class="copy-btn" id="copy-btn" onclick="copyToMatch()">COPY to MATCH <span id="copy-num">1</span></button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
