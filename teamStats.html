<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Team Stats</title>
<link rel="icon" type="image/x-icon" href="img/icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="stylesheet" href="css/teamStats/teamStats.css">
</head>
<body>

<div class="ts-grid">
  <div class="ts-wrap">
    <div class="ts-left"><img class="ts-char" data-i="0"><div class="ts-mvp" data-i="0"></div></div>
    <div class="ts-right">
      <div class="ts-stats">
        <div class="ts-stat"><div class="ts-stat-label">KILLS</div><div class="ts-stat-value" data-i="0" data-s="kills"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">ASSISTS</div><div class="ts-stat-value" data-i="0" data-s="assists"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">KNOCKS</div><div class="ts-stat-value" data-i="0" data-s="knockDown"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">DAMAGE</div><div class="ts-stat-value" data-i="0" data-s="damage"></div></div>
      </div>
    </div>
    <div class="ts-overlay"></div>
  </div>
  <div class="ts-wrap">
    <div class="ts-left"><img class="ts-char" data-i="1"><div class="ts-mvp" data-i="1"></div></div>
    <div class="ts-right">
      <div class="ts-stats">
        <div class="ts-stat"><div class="ts-stat-label">KILLS</div><div class="ts-stat-value" data-i="1" data-s="kills"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">ASSISTS</div><div class="ts-stat-value" data-i="1" data-s="assists"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">KNOCKS</div><div class="ts-stat-value" data-i="1" data-s="knockDown"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">DAMAGE</div><div class="ts-stat-value" data-i="1" data-s="damage"></div></div>
      </div>
    </div>
    <div class="ts-overlay"></div>
  </div>
  <div class="ts-wrap">
    <div class="ts-left"><img class="ts-char" data-i="2"><div class="ts-mvp" data-i="2"></div></div>
    <div class="ts-right">
      <div class="ts-stats">
        <div class="ts-stat"><div class="ts-stat-label">KILLS</div><div class="ts-stat-value" data-i="2" data-s="kills"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">ASSISTS</div><div class="ts-stat-value" data-i="2" data-s="assists"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">KNOCKS</div><div class="ts-stat-value" data-i="2" data-s="knockDown"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">DAMAGE</div><div class="ts-stat-value" data-i="2" data-s="damage"></div></div>
      </div>
    </div>
    <div class="ts-overlay"></div>
  </div>
  <div class="ts-wrap">
    <div class="ts-left"><img class="ts-char" data-i="3"><div class="ts-mvp" data-i="3"></div></div>
    <div class="ts-right">
      <div class="ts-stats">
        <div class="ts-stat"><div class="ts-stat-label">KILLS</div><div class="ts-stat-value" data-i="3" data-s="kills"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">ASSISTS</div><div class="ts-stat-value" data-i="3" data-s="assists"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">KNOCKS</div><div class="ts-stat-value" data-i="3" data-s="knockDown"></div></div>
        <div class="ts-stat"><div class="ts-stat-label">DAMAGE</div><div class="ts-stat-value" data-i="3" data-s="damage"></div></div>
      </div>
    </div>
    <div class="ts-overlay"></div>
  </div>
</div>

<script src="js/logos.js"></script>
<script src="js/teamStats.js"></script>
</body>
</html>
